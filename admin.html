<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TFT 관리자</title><style>*{box-sizing:border-box}body{margin:0;background:#0d111b;color:#eef2fa;font:15px system-ui}header{background:#151d2b;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:10px}main{max-width:850px;margin:25px auto;padding:0 15px}.card{background:#171e2c;border:1px solid #344058;border-radius:12px;padding:20px;margin-bottom:15px}h1{font-size:20px;margin:0}h2{font-size:17px}p,small{color:#aebbd0}button{background:#2d3b51;border:1px solid #53627c;color:white;border-radius:8px;padding:11px 14px;cursor:pointer;margin:5px 5px 5px 0}button:hover{border-color:#e6b76a}button:disabled{opacity:.5}input{max-width:100%}a{color:#dcb875}#msg{white-space:pre-wrap;background:#233047;padding:12px;border-radius:7px}code{word-break:break-all}</style><header><h1>⚙ TFT 관리자 페이지</h1><div><a href="/">사용자 화면</a> <button id="logout">로그아웃</button></div></header><main><section class="card"><h2>데이터 상태</h2><div id="state">조회 중…</div><button id="check">상태 새로고침</button></section><section class="card"><h2>온라인 데이터 갱신</h2><p>CommunityDragon 한국어 원본에서 세트 18 데이터가 있는지 확인한 후 서버 캐시에 저장해. 연결에 시간이 걸릴 수 있어.</p><button id="refresh">온라인 데이터 가져오기</button></section><section class="card"><h2>JSON 파일 직접 업로드</h2><p>CommunityDragon <code>ko_kr.json</code> 원본 파일을 선택해. 세트 18 필수 필드를 검증한 다음 적용해.</p><input type="file" id="file" accept=".json,application/json"><button id="upload">선택한 JSON 적용</button></section><section class="card"><h2>작업 결과</h2><div id="msg" role="status">대기 중</div></section><small>관리자 페이지와 관리 API는 로그인 인증을 통과해야 접근 가능해. 이 로컬 서버는 127.0.0.1에만 연결돼.</small></main><script>
const $=x=>document.getElementById(x);const message=t=>$('msg').textContent=t;
async function call(url,options){const r=await fetch(url,options);const d=await r.json();if(r.status===401){location.href='/login';throw Error('로그인 필요')}if(!r.ok)throw Error(d.error||'요청 실패');return d}
async function status(){try{const d=await call('/api/admin/status');$('state').textContent=d.ready?`연결됨 · 기물 ${d.counts.champions} · 특성 ${d.counts.traits} · 원본 아이템 ${d.counts.items} · ${new Date(d.updated*1000).toLocaleString('ko-KR')} · ${(d.size/1024/1024).toFixed(1)} MB`:'아직 데이터 없음';}catch(e){message(e.message)}}
$('check').onclick=status;
$('refresh').onclick=async()=>{const b=$('refresh');b.disabled=true;message('온라인 다운로드 및 데이터 검증 중…');try{const d=await call('/api/admin/refresh',{method:'POST'});message('갱신 완료 · '+JSON.stringify(d.counts));await status()}catch(e){message('실패: '+e.message)}finally{b.disabled=false}};
$('upload').onclick=async()=>{const f=$('file').files[0];if(!f)return message('JSON 파일을 먼저 선택해 줘');const b=$('upload');b.disabled=true;message('파일 읽기 및 업로드 중…');try{const obj=JSON.parse(await f.text());const d=await call('/api/admin/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)});message('업로드 완료 · '+JSON.stringify(d.counts));await status()}catch(e){message('실패: '+e.message)}finally{b.disabled=false}};
$('logout').onclick=async()=>{await call('/api/admin/logout',{method:'POST'});location.href='/login'};status();
</script></html>
