<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>관리자 로그인</title><style>body{background:#0d111b;color:#eef2fa;font:15px system-ui;display:grid;place-items:center;min-height:100vh;margin:0}.card{width:min(390px,calc(100vw - 32px));background:#171e2c;border:1px solid #364158;border-radius:14px;padding:25px;box-sizing:border-box}input,button{box-sizing:border-box;width:100%;padding:13px;border-radius:8px;margin:8px 0;font:inherit}input{background:#0c1320;border:1px solid #46516a;color:white}button{background:#ac8543;border:0;color:white;cursor:pointer}a{color:#cbb083}p{color:#aebad0}#error{color:#f6a3a3}</style><div class="card"><h2>🔐 관리자 로그인</h2><p>서버를 실행한 터미널에 표시된 관리자 비밀번호를 입력해 줘.</p><form id="f"><input id="pw" type="password" placeholder="관리자 비밀번호" autocomplete="current-password" required><button>로그인</button></form><p id="error" role="alert"></p><a href="/">← 일반 화면으로</a></div><script>document.getElementById('f').onsubmit=async e=>{e.preventDefault();const b=document.querySelector('button');b.disabled=true;try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('pw').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'로그인 실패');location.href='/admin'}catch(err){document.getElementById('error').textContent=err.message}finally{b.disabled=false}}</script></html>
